<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Викторина</title>
    <style>
        :root {
            --text-color: #333333;
            --bg-color: #f5f5f5;
            --btn-color: #4a90e2;
            --font-size: 16px;
            --spacing: 1rem;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: var(--font-size);
            line-height: 1.6;
            min-height: 100vh;
            padding: 1rem;
            padding-top: 80px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Панель управления */
        .controls {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--bg-color);
            border-bottom: 2px solid var(--btn-color);
            padding: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            z-index: 100;
            flex-wrap: wrap;
            transition: background-color 0.3s ease;
        }

        .control-btn {
            background: var(--btn-color);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 0.4rem 0.8rem;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, background-color 0.3s ease;
        }

        .control-btn:hover {
            opacity: 0.8;
        }

        .color-picker {
            width: 40px;
            height: 40px;
            border: 2px solid var(--btn-color);
            border-radius: var(--radius);
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .reset-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 0.4rem 0.8rem;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .reset-btn:hover {
            opacity: 0.8;
        }

        /* Экраны */
        .screen {
            display: none;
            max-width: 600px;
            margin: 0 auto;
        }

        .screen.active {
            display: block;
        }

        /* Главный экран */
        .mode-selection {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .mode-selection h1 {
            font-size: calc(var(--font-size) * 1.8);
            text-align: center;
            margin-bottom: 1rem;
        }

        .mode-btn {
            background: var(--btn-color);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 1.5rem 2rem;
            font-size: calc(var(--font-size) * 1.2);
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: transform 0.2s, opacity 0.2s, background-color 0.3s ease;
        }

        .mode-btn:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        .options-selector {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .options-selector label {
            font-weight: 600;
            font-size: calc(var(--font-size) * 1);
        }

        .options-selector select {
            padding: 0.5rem;
            border-radius: var(--radius);
            border: 2px solid var(--btn-color);
            font-size: calc(var(--font-size) * 1);
            background: white;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        /* Экран викторины */
        .quiz-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .question-header {
            font-size: calc(var(--font-size) * 1.5);
            font-weight: 600;
            text-align: center;
            padding: 1rem;
            background: white;
            border-radius: var(--radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            color: var(--text-color);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-btn {
            background: var(--btn-color);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 1rem;
            font-size: calc(var(--font-size) * 1);
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s, background-color 0.3s ease;
            text-align: left;
        }

        .option-btn:hover {
            opacity: 0.9;
            transform: translateX(4px);
        }

        .option-btn.correct {
            background: #4caf50 !important;
        }

        .option-btn.incorrect {
            background: #f44336 !important;
        }

        /* Счётчик и статистика */
        .stats {
            text-align: center;
            font-size: calc(var(--font-size) * 1.1);
            font-weight: 600;
            padding: 1rem;
            background: white;
            border-radius: var(--radius);
            color: var(--text-color);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--btn-color);
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* Экран результатов */
        .result-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            text-align: center;
        }

        .result-score {
            font-size: calc(var(--font-size) * 3);
            font-weight: 700;
            color: var(--btn-color);
            transition: color 0.3s ease;
        }

        .result-message {
            font-size: calc(var(--font-size) * 1.2);
            line-height: 1.8;
            max-width: 500px;
            color: var(--text-color);
        }

        .result-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .result-btn {
            background: var(--btn-color);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 1rem 1.5rem;
            font-size: calc(var(--font-size) * 1);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: opacity 0.2s, background-color 0.3s ease;
        }

        .result-btn:hover {
            opacity: 0.9;
        }

        .icon {
            width: 20px;
            height: 20px;
        }

        /* Мобильная адаптация */
        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
                padding-top: 70px;
            }

            .controls {
                gap: 0.5rem;
                padding: 0.3rem;
            }

            .control-btn, .reset-btn {
                padding: 0.3rem 0.6rem;
                font-size: 0.9rem;
            }

            .color-picker {
                width: 35px;
                height: 35px;
            }

            .question-header {
                font-size: 1.3rem;
            }

            .result-score {
                font-size: calc(var(--font-size) * 2.5);
            }
        }
    </style>
</head>

<body>
    <!-- Панель управления -->
    <div class="controls">
        <button class="control-btn" onclick="adjustFontSize(-1)" title="Уменьшить шрифт">A-</button>
        <button class="control-btn" onclick="adjustFontSize(1)" title="Увеличить шрифт">A+</button>
        <input type="color" class="color-picker" id="text-color-picker" value="#333333" onchange="updateColor('--text-color', this.value)" title="Цвет текста">
        <input type="color" class="color-picker" id="bg-color-picker" value="#f5f5f5" onchange="updateColor('--bg-color', this.value)" title="Цвет фона">
        <input type="color" class="color-picker" id="btn-color-picker" value="#4a90e2" onchange="updateColor('--btn-color', this.value)" title="Цвет кнопок">
        <button class="reset-btn" onclick="resetSettings()" title="Сбросить настройки">↺</button>
    </div>

    <!-- Главный экран -->
    <div id="home-screen" class="screen active">
        <div class="mode-selection">
            <h1>Выберите режим</h1>
            <button class="mode-btn" onclick="startMode('training')">📚 Тренировка</button>
            <button class="mode-btn" onclick="startMode('testing')">📝 Тестирование</button>
            <div class="options-selector">
                <label for="options-count">Вариантов ответов:</label>
                <select id="options-count" onchange="updateOptionsCount(this.value)">
                    <option value="2">2 варианта</option>
                    <option value="3" selected>3 варианта</option>
                    <option value="4">4 варианта</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Экран викторины -->
    <div id="quiz-screen" class="screen">
        <div class="quiz-container">
            <div class="question-header" id="question-text"></div>
            <div class="options-list" id="options-container"></div>
            <div class="stats" id="stats-display"></div>
            <button class="mode-btn" onclick="finishQuiz()">Завершить</button>
        </div>
    </div>

    <!-- Экран результатов -->
    <div id="result-screen" class="screen">
        <div class="result-container">
            <div class="result-score" id="final-score"></div>
            <div class="result-message" id="result-message1"></div>
            <div class="result-message" id="result-message2"></div>
            <div class="result-buttons">
                <button class="result-btn" onclick="restartQuiz()">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                        <path d="M21 3v5h-5"></path>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                        <path d="M3 21v-5h5"></path>
                    </svg>
                    Ещё раз
                </button>
                <button class="result-btn" onclick="goHome()">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    На главную
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * @typedef {Object} QuizItem
         * @property {string} question - Текст вопроса
         * @property {string} answer - Текст ответа
         */

        /** @const {number} Количество пар вопрос-ответ (измените при необходимости) */
        const TOTAL_PAIRS = 10;

        /** @const {number} Количество вопросов в режиме тестирования */
        const TEST_QUESTIONS_COUNT = 6;

        /** @const {Object} Цвета по умолчанию */
        const DEFAULT_SETTINGS = {
            textColor: '#333333',
            bgColor: '#f5f5f5',
            btnColor: '#4a90e2',
            fontSize: 16
        };

        /**
         * @type {QuizItem[]} Массив пар вопрос-ответ
         * Замените содержимое на свои данные
         */
        const quizData = [
            { question: "Вопрос1", answer: "Ответ1" },
            { question: "Вопрос2", answer: "Ответ2" },
            { question: "Вопрос3", answer: "Ответ3" },
            { question: "Вопрос4", answer: "Ответ4" },
            { question: "Вопрос5", answer: "Ответ5" },
            { question: "Вопрос6", answer: "Ответ6" },
            { question: "Вопрос7", answer: "Ответ7" },
            { question: "Вопрос8", answer: "Ответ8" },
            { question: "Вопрос9", answer: "Ответ9" },
            { question: "Вопрос10", answer: "Ответ10" }
        ];

        /** @type {Object} Состояние приложения */
        const state = {
            mode: null, // 'training' | 'testing'
            optionsCount: 3,
            score: 0,
            totalQuestions: 0,
            usedIndices: new Set(), // для тестирования
            lastIndices: [], // последние 2 индекса для тренировки
            currentQuestion: null
        };

        /** Инициализация при загрузке */
        window.addEventListener('DOMContentLoaded', () => {
            loadSettings();
        });

        /** Загрузка настроек из localStorage */
        function loadSettings() {
            const saved = localStorage.getItem('quizSettings');
            if (saved) {
                try {
                    const settings = JSON.parse(saved);
                    if (settings.fontSize) {
                        document.documentElement.style.setProperty('--font-size', settings.fontSize + 'px');
                    }
                    if (settings.textColor) {
                        document.documentElement.style.setProperty('--text-color', settings.textColor);
                        document.getElementById('text-color-picker').value = settings.textColor;
                    }
                    if (settings.bgColor) {
                        document.documentElement.style.setProperty('--bg-color', settings.bgColor);
                        document.getElementById('bg-color-picker').value = settings.bgColor;
                    }
                    if (settings.btnColor) {
                        document.documentElement.style.setProperty('--btn-color', settings.btnColor);
                        document.getElementById('btn-color-picker').value = settings.btnColor;
                    }
                } catch (e) {
                    console.error('Ошибка загрузки настроек:', e);
                }
            }
        }

        /** Сохранение настроек в localStorage */
        function saveSettings() {
            const settings = {
                fontSize: parseInt(document.documentElement.style.getPropertyValue('--font-size')) || DEFAULT_SETTINGS.fontSize,
                textColor: document.getElementById('text-color-picker').value,
                bgColor: document.getElementById('bg-color-picker').value,
                btnColor: document.getElementById('btn-color-picker').value
            };
            localStorage.setItem('quizSettings', JSON.stringify(settings));
        }

        /** Сброс настроек к значениям по умолчанию */
        function resetSettings() {
            document.documentElement.style.setProperty('--font-size', DEFAULT_SETTINGS.fontSize + 'px');
            document.documentElement.style.setProperty('--text-color', DEFAULT_SETTINGS.textColor);
            document.documentElement.style.setProperty('--bg-color', DEFAULT_SETTINGS.bgColor);
            document.documentElement.style.setProperty('--btn-color', DEFAULT_SETTINGS.btnColor);
            
            document.getElementById('text-color-picker').value = DEFAULT_SETTINGS.textColor;
            document.getElementById('bg-color-picker').value = DEFAULT_SETTINGS.bgColor;
            document.getElementById('btn-color-picker').value = DEFAULT_SETTINGS.btnColor;
            
            localStorage.removeItem('quizSettings');
        }

        /**
         * Изменение размера шрифта
         * @param {number} delta - Изменение в px (+1 или -1)
         */
        function adjustFontSize(delta) {
            const currentSize = parseInt(document.documentElement.style.getPropertyValue('--font-size')) || DEFAULT_SETTINGS.fontSize;
            const newSize = Math.max(12, Math.min(24, currentSize + delta * 2));
            document.documentElement.style.setProperty('--font-size', newSize + 'px');
            saveSettings();
        }

        /**
         * Обновление CSS переменной цвета
         * @param {string} varName - Имя CSS переменной
         * @param {string} color - HEX цвет
         */
        function updateColor(varName, color) {
            document.documentElement.style.setProperty(varName, color);
            saveSettings();
        }

        /**
         * Обновление количества вариантов ответов
         * @param {string} value - Количество вариантов (2, 3 или 4)
         */
        function updateOptionsCount(value) {
            state.optionsCount = parseInt(value);
        }

        /**
         * Переключение между экранами
         * @param {string} screenId - ID экрана
         */
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        /**
         * Запуск выбранного режима
         * @param {'training'|'testing'} mode - Режим работы
         */
        function startMode(mode) {
            state.mode = mode;
            state.score = 0;
            state.totalQuestions = 0;
            state.usedIndices.clear();
            state.lastIndices = [];
            showScreen('quiz-screen');
            loadNextQuestion();
        }

        /**
         * Получение случайного индекса из доступных
         * @returns {number|null} Индекс или null если все использованы
         */
        function getRandomIndex() {
            if (state.mode === 'testing') {
                // В тестировании все вопросы уникальны
                const available = [];
                for (let i = 0; i < TOTAL_PAIRS; i++) {
                    if (!state.usedIndices.has(i)) {
                        available.push(i);
                    }
                }
                if (available.length === 0) return null;
                const index = available[Math.floor(Math.random() * available.length)];
                state.usedIndices.add(index);
                return index;
            } else {
                // В тренировке избегаем повторов подряд (последние 2)
                const available = [];
                for (let i = 0; i < TOTAL_PAIRS; i++) {
                    if (!state.lastIndices.includes(i)) {
                        available.push(i);
                    }
                }
                if (available.length === 0) {
                    // Если все варианты исчерпаны, сбрасываем последние
                    state.lastIndices = [];
                    for (let i = 0; i < TOTAL_PAIRS; i++) {
                        available.push(i);
                    }
                }
                const index = available[Math.floor(Math.random() * available.length)];
                state.lastIndices.push(index);
                if (state.lastIndices.length > 2) {
                    state.lastIndices.shift();
                }
                return index;
            }
        }

        /** Загрузка следующего вопроса */
        function loadNextQuestion() {
            // Проверка завершения тестирования
            if (state.mode === 'testing' && state.totalQuestions >= TEST_QUESTIONS_COUNT) {
                finishQuiz();
                return;
            }

            const index = getRandomIndex();
            if (index === null) {
                finishQuiz();
                return;
            }

            const item = quizData[index];
            
            // Случайно выбираем: показать вопрос или ответ как заголовок
            const showQuestion = Math.random() > 0.5;
            const header = showQuestion ? item.question : item.answer;
            const correctAnswer = showQuestion ? item.answer : item.question;
            
            state.currentQuestion = { correctAnswer, itemIndex: index };
            
            // Отображение заголовка
            document.getElementById('question-text').textContent = header;
            
            // Генерация вариантов ответов
            const options = [correctAnswer];
            const otherItems = quizData.filter((_, i) => i !== index);
            
            // Добавляем неправильные варианты
            while (options.length < state.optionsCount && otherItems.length > 0) {
                const randomIndex = Math.floor(Math.random() * otherItems.length);
                const wrongAnswer = showQuestion 
                    ? otherItems[randomIndex].answer 
                    : otherItems[randomIndex].question;
                if (!options.includes(wrongAnswer)) {
                    options.push(wrongAnswer);
                }
                otherItems.splice(randomIndex, 1);
            }
            
            // Перемешиваем варианты
            options.sort(() => Math.random() - 0.5);
            
            // Отображение кнопок вариантов
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(btn, option === correctAnswer);
                container.appendChild(btn);
            });
            
            // Обновление статистики
            updateStats();
        }

        /**
         * Проверка ответа
         * @param {HTMLButtonElement} btn - Нажатая кнопка
         * @param {boolean} isCorrect - Правильность ответа
         */
        function checkAnswer(btn, isCorrect) {
            // Отключаем все кнопки
            const allButtons = document.querySelectorAll('.option-btn');
            allButtons.forEach(b => {
                b.disabled = true;
            });
            
            // Подсвечиваем выбранный ответ
            btn.classList.add(isCorrect ? 'correct' : 'incorrect');
            
            // Если ответ неправильный - подсвечиваем правильный зелёным
            if (!isCorrect && state.currentQuestion) {
                allButtons.forEach(b => {
                    if (b.textContent === state.currentQuestion.correctAnswer) {
                        b.classList.add('correct');
                    }
                });
            }
            
            if (isCorrect) {
                state.score++;
            }
            state.totalQuestions++;
            
            // Переход к следующему вопросу через задержку
            setTimeout(() => {
                loadNextQuestion();
            }, 1000);
        }

        /** Обновление отображения статистики */
        function updateStats() {
            const statsDisplay = document.getElementById('stats-display');
            if (state.mode === 'testing') {
                const progress = (state.totalQuestions / TEST_QUESTIONS_COUNT) * 100;
                statsDisplay.innerHTML = `
                    Вопрос ${state.totalQuestions + 1} из ${TEST_QUESTIONS_COUNT}
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progress}%"></div>
                    </div>
                `;
            } else {
                statsDisplay.textContent = `${state.score} из ${state.totalQuestions}`;
            }
        }

        /** Завершение викторины и показ результатов */
        function finishQuiz() {
            showScreen('result-screen');
            
            const scoreElement = document.getElementById('final-score');
            
            if (state.mode === 'training') {
                scoreElement.textContent = `${state.score} из ${state.totalQuestions}`;
                const percentage = state.totalQuestions > 0 ? (state.score / state.totalQuestions) * 100 : 0;
                let message1 = '';
                let message2 = '';
                if (percentage >= 80) {
                    message1 = 'Отличный результат!';
                    message2 = 'Продолжайте в том же духе! 🎉';
                } else if (percentage >= 60) {
                    message1 = 'Хороший результат!';
                    message2 = 'Есть куда расти! 💪';
                } else if (percentage >= 40) {
                    message1 = 'Неплохо для начала!';
                    message2 = 'Практика сделает вас мастером! 📚';
                } else {
                    message1 = 'Не сдавайтесь!';
                    message2 = 'Каждая попытка приближает к успеху! 🚀';
                }
                document.getElementById('result-message1').textContent = message1;
                document.getElementById('result-message2').textContent = message2;
            } else {
                // Тестирование - оценка по шкале
                let grade = '';
                let message1 = '';
                let message2 = '';
                if (state.score <= 1) {
                    grade = '1';
                    message1 = 'Это только начало пути!';
                    message2 = 'У вас впереди много открытий! 🌱';
                } else if (state.score === 2) {
                    grade = '2';
                    message1 = 'Вы на правильном пути!';
                    message2 = 'Продолжайте учиться! 📖';
                } else if (state.score === 3) {
                    grade = '3';
                    message1 = 'Удовлетворительный результат!';
                    message2 = 'Есть потенциал для роста! ⭐';
                } else if (state.score === 4) {
                    grade = '4';
                    message1 = 'Хороший результат!';
                    message2 = 'Вы хорошо подготовились! 👍';
                } else if (state.score === 5) {
                    grade = '5';
                    message1 = 'Отлично!';
                    message2 = 'Вы настоящий знаток! 🏆';
                } else {
                    grade = '5+';
                    message1 = 'Превосходно!';
                    message2 = 'Вы мастер своего дела! 🌟';
                }
                scoreElement.textContent = grade;
                document.getElementById('result-message1').textContent = message1;
                document.getElementById('result-message2').textContent = message2;
            }
        }

        /** Перезапуск викторины в том же режиме */
        function restartQuiz() {
            startMode(state.mode);
        }

        /** Возврат на главный экран */
        function goHome() {
            state.mode = null;
            state.score = 0;
            state.totalQuestions = 0;
            state.usedIndices.clear();
            state.lastIndices = [];
            showScreen('home-screen');
        }
    </script>
</body>
</html>
